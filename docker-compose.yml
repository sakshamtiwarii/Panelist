services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: panelist
      POSTGRES_PASSWORD: panelist
      POSTGRES_DB: panelist
    ports:
      # Published high and overridable: dev machines routinely already run
      # Postgres, and Docker publishes on 0.0.0.0 so it collides with any
      # instance bound to all interfaces. The API reaches the database as
      # db:5432 on the compose network regardless — this mapping is only for
      # host tooling like psql. PANELIST_DB_PORT=5599 docker compose up
      - "${PANELIST_DB_PORT:-55432}:5432"
    volumes:
      - panelist_db_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on alone waits for the container, not for Postgres to accept
      # connections — the API wins that race on a cold start and falls back to
      # its in-memory store.
      test: ["CMD-SHELL", "pg_isready -U panelist -d panelist"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build:
      # Context is the repo root so the solver packages are baked into the
      # image; the volume mounts below are for dev hot-reload only.
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # One mount of the repo, matching the image layout, so POST /generate
      # writes datasets somewhere that survives the container.
      - .:/app
      # Keep the image's editable install; the bind mount above would otherwise
      # hide it behind the host directory.
      - /app/panelist.egg-info
    ports:
      - "${PANELIST_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://panelist:panelist@db:5432/panelist
      # Signing key for session cookies. The compose default is fine for a
      # local demo; a real deployment must set its own, or every restart
      # invalidates all sessions.
      PANELIST_SECRET_KEY: ${PANELIST_SECRET_KEY:-panelist-local-demo-key}
      # No PANELIST_CORS_ORIGINS: the dashboard proxies to this service
      # server-side, so nothing the browser sends here is cross-origin. The
      # middleware stays in api/main.py for anyone calling the API directly.
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    command: npm run dev
    volumes:
      - ./dashboard:/app
      # Keep the image's node_modules; the bind mount above would otherwise
      # hide them behind the host directory, which has none in a clean clone.
      - /app/node_modules
    ports:
      # Every published port is overridable: dev machines routinely already run
      # something on 3000/8000/5432. Defaults match the documented URLs, so a
      # clean machine needs no environment at all.
      # e.g. PANELIST_WEB_PORT=3001 docker compose up
      - "${PANELIST_WEB_PORT:-3000}:3000"
    environment:
      # Resolved inside the container, not in the browser: the dashboard
      # forwards /api/* to the solver over the compose network, so the page and
      # the API share one origin and the browser never learns the API's address.
      PANELIST_API_ORIGIN: http://api:8000
    depends_on:
      - api

volumes:
  panelist_db_data:
