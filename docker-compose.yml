services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: panelist
      POSTGRES_PASSWORD: panelist
      POSTGRES_DB: panelist
    ports:
      - "5432:5432"
    volumes:
      - panelist_db_data:/var/lib/postgresql/data

  api:
    build:
      # Context is the repo root so the solver packages are baked into the
      # image; the volume mounts below are for dev hot-reload only.
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
      - ./scheduler:/app/scheduler
      - ./replanner:/app/replanner
      - ./generator:/app/generator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://panelist:panelist@db:5432/panelist
    depends_on:
      - db

  # Re-enable at build-order step 5 (guide section 7), once dashboard/ exists.
  # Left commented so `docker compose up` works today for db + api.
  # dashboard:
  #   build: ./dashboard
  #   command: npm run dev
  #   volumes:
  #     - ./dashboard:/app
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   depends_on:
  #     - api

volumes:
  panelist_db_data:
