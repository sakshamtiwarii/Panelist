services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: panelist
      POSTGRES_PASSWORD: panelist
      POSTGRES_DB: panelist
    ports:
      # Published high and overridable because developer machines routinely
      # already run Postgres — 5432 and 5433 are both commonly taken, and
      # Docker publishes on 0.0.0.0, so it collides with any instance bound to
      # all interfaces even when localhost-only tools report the port free.
      # The API reaches the database as db:5432 on the compose network
      # regardless; this mapping exists only for host tooling like psql.
      # Override with: PANELIST_DB_PORT=5599 docker compose up
      - "${PANELIST_DB_PORT:-55432}:5432"
    volumes:
      - panelist_db_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on alone only waits for the CONTAINER to start, not for
      # Postgres to accept connections — the API wins that race on a cold
      # start and silently falls back to its in-memory store.
      test: ["CMD-SHELL", "pg_isready -U panelist -d panelist"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build:
      # Context is the repo root so the solver packages are baked into the
      # image; the volume mounts below are for dev hot-reload only.
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
      - ./scheduler:/app/scheduler
      - ./replanner:/app/replanner
      - ./generator:/app/generator
      - ./store:/app/store
      # Datasets are generated artefacts and gitignored, so a fresh clone has
      # none. Mounting the host directory means POST /generate writes somewhere
      # that survives the container, and an existing dataset is picked up
      # without rebuilding the image.
      - ./data:/app/data
    ports:
      - "${PANELIST_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://panelist:panelist@db:5432/panelist
      # The browser's origin is the published host port, not the container's.
      # Signing key for session cookies. The compose default is fine for a
      # local demo; a real deployment must set its own, or every restart
      # invalidates all sessions.
      PANELIST_SECRET_KEY: ${PANELIST_SECRET_KEY:-panelist-local-demo-key}
      PANELIST_CORS_ORIGINS: >-
        http://localhost:${PANELIST_WEB_PORT:-3000},http://127.0.0.1:${PANELIST_WEB_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    command: npm run dev
    volumes:
      - ./dashboard:/app
      # Keep the image's node_modules; the bind mount above would otherwise
      # hide them behind the host directory, which has none in a clean clone.
      - /app/node_modules
    ports:
      # Every published port is overridable: dev machines routinely already run
      # something on 3000/8000/5432. Defaults match the documented URLs, so a
      # clean machine needs no environment at all.
      # e.g. PANELIST_WEB_PORT=3001 docker compose up
      - "${PANELIST_WEB_PORT:-3000}:3000"
    environment:
      # Resolved in the browser, not in the container, so it points at the
      # published host port rather than the compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:${PANELIST_API_PORT:-8000}
    depends_on:
      - api

volumes:
  panelist_db_data:
