name: CI

on:
  push:
    branches: [main, dashboard]
  pull_request:

jobs:
  api:
    name: Python — install, lint, test
    runs-on: ubuntu-latest

    # The in-memory store is only the fallback; Postgres is the path that runs
    # in production, so the parity suite gets a real server to check it against.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panelist
          POSTGRES_PASSWORD: panelist
          POSTGRES_DB: panelist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PANELIST_TEST_DATABASE_URL: postgresql://panelist:panelist@localhost:5432/panelist_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The package install is itself the test that the layout is sound: it is
      # what replaced four sys.path.insert() calls, so a regression there fails
      # here rather than at runtime in a container.
      - name: Install
        run: pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check .

      # data/ is gitignored, so a fresh checkout has no dataset. The API suite
      # generates its own; this only proves the CLI path still works.
      - name: Generate a dataset
        run: python -m generator.generate --seed 42 --companies 6 --students 40 --rooms 3 --days 4 --out ./data/small

      - name: Solve it
        run: python -m scheduler.run --data ./data/small --time-limit 20

      # The whole suite, not a list of files. Naming files here meant a new
      # test file was opt-in: every regression test added after this step was
      # written ran locally and never in CI, so the bug it guarded could come
      # back with the build still green. `testpaths` in pyproject.toml scopes
      # this to tests/.
      #
      # Covers the API contract, both stores (the parity cases run against
      # Postgres because PANELIST_TEST_DATABASE_URL is set above; without it
      # only the memory half would run), the solver's accounting and
      # verification, disruption handling, the generator's input contract,
      # priority overrides, and the API's dataset cache.
      - name: Tests
        run: pytest -q

  # The replanner is the core of the project, so it gets checked in CI rather
  # than only on a developer's machine. It runs as its own job because it is
  # solver-bound and slow (five scenarios against the full 1013-interview
  # instance), and there is no reason to make the fast checks wait for it.
  replan:
    name: Replan scenarios — correctness under disruption
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A GitHub runner has far fewer cores than a dev machine, so the solver
      # gets fewer workers and needs more wall-clock for the same result.
      PANELIST_REPLAN_TIME_LIMIT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Generate the primary dataset
        run: python -m generator.generate --seed 42 --companies 35 --students 800 --rooms 20 --days 4 --load-factor 0.9 --out ./data/primary

      - name: Solve it
        run: python -m scheduler.run --data ./data/primary --time-limit 60

      # Zero student clashes (recomputed independently of the solver), the
      # model's own hard-constraint verification, and interviews already under
      # way neither moved nor cancelled — for every disruption type.
      - name: Replan scenarios
        run: python -m tests.test_replan_scenarios

  dashboard:
    name: Dashboard — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
