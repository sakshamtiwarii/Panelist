[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelist"
version = "0.1.0"
description = "Placement-week interview scheduler: CP-SAT solver, replanner and coordinator API."
requires-python = ">=3.11"
# Read from requirements.txt so the Docker layer that caches the slow ortools
# install and this package are built from one list.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
panelist-generate = "generator.generate:main"
panelist-solve = "scheduler.run:main"
panelist-replan = "replanner.run:main"

# Installed rather than discovered by patching sys.path at import time, so the
# app runs identically from the repo root, from a container, and under pytest.
[tool.setuptools]
packages = ["api", "generator", "replanner", "scheduler", "store"]

[tool.setuptools.package-data]
store = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
